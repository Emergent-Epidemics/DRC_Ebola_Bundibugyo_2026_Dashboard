# Build output/{index,spatial-risk,trends,context}.html + output/assets/ and
# sync repo-root copies of all of them for GitHub Pages.
# Triggered on dashboard pushes to main, via repository_dispatch from BDBV2026-Data or
# BDBV2026-Processed_Sensitive_Data, or manually.
#
# The "linelist" naming below (LINELIST_REF, linelist_repo_ref, the
# linelist-updated dispatch type, client_payload.linelist_ref) is historical --
# this used to source dashboard_plots/ from BDBV2026-Linelist_Processing. That
# source has since moved to BDBV2026-Processed_Sensitive_Data (its
# trigger-dashboard-rebuild.yml is what actually sends the linelist-updated
# dispatch), but the field/type names are a contract with that sender, so
# they're kept as-is here rather than renamed independently.
#
# MANUAL FOLLOW-UP NEEDED (not done by this change):
#   EXTERNAL_REPO_TOKEN must grant Contents: Read on
#   INRB-UMIE/BDBV2026-Processed_Sensitive_Data (not the old
#   BDBV2026-Linelist_Processing) for the checkout step below to work.

name: Build dashboard

on:
  push:
    branches:
      - main
    paths-ignore:
      - "output/**"
      - "index.html"
      - "spatial-risk.html"
      - "trends.html"
      - "context.html"
      - "clinical-symptoms.html"
      - "surveillance-testing.html"
      - "genomic-epidemiology.html"
      - "assets/**"
      - "pr-preview/**"
  workflow_dispatch:
    inputs:
      data_repo_ref:
        description: "BDBV2026-Data git ref (branch, tag, or SHA). Leave empty for latest GitHub release."
        required: false
        default: ""
      linelist_repo_ref:
        description: "BDBV2026-Processed_Sensitive_Data git ref for outputs/*/dashboard_plots. Default: main."
        required: false
        default: "main"
  repository_dispatch:
    types: [data-updated, linelist-updated]

permissions:
  contents: write

concurrency:
  group: build-dashboard-${{ github.ref }}
  cancel-in-progress: true

env:
  DATA_REPO: INRB-UMIE/BDBV2026-Data
  # Historically BDBV2026-Linelist_Processing -- see header comment.
  PROCESSED_DATA_REPO: INRB-UMIE/BDBV2026-Processed_Sensitive_Data

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve refs
        id: refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          resolve_latest_data_ref() {
            if release_json="$(gh release view --repo "${DATA_REPO}" --json targetCommitish,tagName 2>/dev/null)"; then
              ref="$(jq -r '.targetCommitish' <<< "${release_json}")"
              tag="$(jq -r '.tagName' <<< "${release_json}")"
              echo "Using latest ${DATA_REPO} release ${tag} @ ${ref}" >&2
              echo "${ref}"
              return
            fi
            echo "::warning::No GitHub release found on ${DATA_REPO}; falling back to main." >&2
            echo "main"
          }

          DASH_REF="${{ github.ref_name }}"
          DATA_REF=""
          LINELIST_REF="main"
          DATA_SOURCE="latest-release"

          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            if [ -n "${{ github.event.client_payload.dashboard_branch }}" ]; then
              DASH_REF="${{ github.event.client_payload.dashboard_branch }}"
            fi
            if [ "${{ github.event.action }}" = "data-updated" ]; then
              DATA_SOURCE="data-dispatch"
              if [ -n "${{ github.event.client_payload.data_ref }}" ]; then
                DATA_REF="${{ github.event.client_payload.data_ref }}"
              elif [ -n "${{ github.event.client_payload.sha }}" ]; then
                DATA_REF="${{ github.event.client_payload.sha }}"
              fi
            elif [ "${{ github.event.action }}" = "linelist-updated" ]; then
              DATA_SOURCE="linelist-dispatch"
              if [ -n "${{ github.event.client_payload.linelist_ref }}" ]; then
                LINELIST_REF="${{ github.event.client_payload.linelist_ref }}"
              elif [ -n "${{ github.event.client_payload.sha }}" ]; then
                LINELIST_REF="${{ github.event.client_payload.sha }}"
              fi
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DATA_SOURCE="manual"
            if [ -n "${{ inputs.data_repo_ref }}" ]; then
              DATA_REF="${{ inputs.data_repo_ref }}"
            fi
            if [ -n "${{ inputs.linelist_repo_ref }}" ]; then
              LINELIST_REF="${{ inputs.linelist_repo_ref }}"
            fi
          else
            DATA_SOURCE="dashboard-push"
          fi

          if [ -z "${DATA_REF}" ]; then
            DATA_REF="$(resolve_latest_data_ref)"
          fi

          echo "dashboard_ref=${DASH_REF}" >> "$GITHUB_OUTPUT"
          echo "data_ref=${DATA_REF}" >> "$GITHUB_OUTPUT"
          echo "linelist_ref=${LINELIST_REF}" >> "$GITHUB_OUTPUT"
          echo "data_source=${DATA_SOURCE}" >> "$GITHUB_OUTPUT"
          echo "Dashboard branch: ${DASH_REF}"
          echo "Data ref: ${DATA_REF}"
          echo "Linelist ref: ${LINELIST_REF}"

      - name: Checkout dashboard
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.dashboard_ref }}
          lfs: true
          path: dashboard
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout data repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPO }}
          ref: ${{ steps.refs.outputs.data_ref }}
          lfs: true
          path: BDBV2026-Data

      - name: Checkout processed data repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PROCESSED_DATA_REPO }}
          ref: ${{ steps.refs.outputs.linelist_ref }}
          path: BDBV2026-Processed_Sensitive_Data
          token: ${{ secrets.EXTERNAL_REPO_TOKEN }}

      # Genomic-epi producer (public) — supplies the tree/tips/meta/skygrid/
      # exponential products the genomic tab's payload slice ingests. No token
      # needed (public repo); GENOMIC_DIR below points at its public/data/.
      - name: Checkout genomic-epi producer repo
        uses: actions/checkout@v4
        with:
          repository: INRB-UMIE/BDBV2026-Genomic_Epi
          path: BDBV2026-Genomic_Epi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/requirements.txt

      - name: Install dependencies
        run: pip install -r dashboard/requirements.txt

      - name: Build dashboard HTML
        working-directory: dashboard
        env:
          BUILD_DIR: ${{ github.workspace }}/BDBV2026-Data/build
          DATA_ROOT: ${{ github.workspace }}/dashboard/Data
          # Points straight at the processed-data repo's checkout instead of
          # copying/rsyncing outputs/ into dashboard/Data/dashboard_plots
          # first -- data_sources.py already expects DASHBOARD_PLOTS_DIR to
          # be an "outputs/"-shaped directory (manifest.json +
          # <date>/dashboard_plots/...), which is exactly what's checked out
          # above, and it already tolerates a missing manifest.json or a
          # manifest with no "date" field (trends plots are simply hidden
          # with a warning, same as before).
          DASHBOARD_PLOTS_DIR: ${{ github.workspace }}/BDBV2026-Processed_Sensitive_Data/outputs
          GENOMIC_DIR: ${{ github.workspace }}/BDBV2026-Genomic_Epi/public/data
        run: |
          set -euo pipefail
          python Scripts/build_dashboard.py
          # output/{index,spatial-risk,trends,context}.html + output/assets/
          # are the build artefacts; repo-root copies of the same files are
          # what GitHub Pages actually serves (Pages serves from repo root,
          # not output/).
          cp output/index.html index.html
          cp output/spatial-risk.html spatial-risk.html
          cp output/trends.html trends.html
          cp output/context.html context.html
          cp output/clinical-symptoms.html clinical-symptoms.html
          cp output/surveillance-testing.html surveillance-testing.html
          cp output/genomic-epidemiology.html genomic-epidemiology.html
          rm -rf assets
          cp -r output/assets assets

      - name: Commit and push
        working-directory: dashboard
        env:
          DATA_REF: ${{ steps.refs.outputs.data_ref }}
          LINELIST_REF: ${{ steps.refs.outputs.linelist_ref }}
          DATA_REPO: ${{ env.DATA_REPO }}
          PROCESSED_DATA_REPO: ${{ env.PROCESSED_DATA_REPO }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ index.html spatial-risk.html trends.html context.html \
            clinical-symptoms.html surveillance-testing.html genomic-epidemiology.html assets/
          if git diff --cached --quiet; then
            echo "No HTML changes to commit."
            exit 0
          fi
          git commit -m "CI: rebuild dashboard from ${DATA_REPO}@${DATA_REF} and ${PROCESSED_DATA_REPO}@${LINELIST_REF}"
          # On a PR merge this workflow and pr-preview.yml both push to the same
          # branch (they're in different concurrency groups, so nothing
          # serialises them), which makes a bare push a non-fast-forward. Rebase
          # onto the latest remote tip and retry. The two never touch the same
          # paths -- this job writes output/ + root HTML + assets/, pr-preview
          # writes the pr-preview/ umbrella dir -- so the rebase can't conflict.
          branch="${{ steps.refs.outputs.dashboard_ref }}"
          attempts=5
          for attempt in $(seq 1 "${attempts}"); do
            if git push origin "HEAD:${branch}"; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            # Last attempt failed: don't rebase (there'd be no push after it) --
            # fail now so every rebase is always followed by another push try.
            if [ "${attempt}" -eq "${attempts}" ]; then
              echo "::error::push to ${branch} failed after ${attempts} attempts"
              exit 1
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto origin/${branch} and retrying..."
            git pull --rebase origin "${branch}" || { git rebase --abort 2>/dev/null || true; echo "::error::rebase onto origin/${branch} failed"; exit 1; }
          done
