clinical:
  title: "BVD clinical characteristics — DR Congo"
  subtitle: "Clinical profile of the Bundibugyo virus disease (BVD) response · analytic scope {nscope} records that reached sample collection / testing (positive, negative or unknown outcome), of {nraw} in the raw line list · generated {generated}. Onset-based measures use symptom onset ≥ 15 Jun 2026 (earlier onset dates unreliable)."
  header_sub: "Clinical symptoms · data cut <b>{snap}</b>"
  scope_note: "<b>Analytic scope:</b> records that reached sample collection / testing (a sample, laboratory record or final classification); never-sampled / invalidated alerts are excluded. <b>Two status axes are used throughout.</b> <b>Test status</b> = laboratory-confirmed vs test-negative vs <b>unknown</b> (sampled but not yet classified). <b>Vital outcome</b> = <b>died</b> (recorded as a death alert <i>or</i> deceased at sample collection) vs <b>no death recorded</b> — the latter does <i>not</i> imply survival (outcome may simply be unrecorded), so death proportions are not a case-fatality rate. The time window is anchored on notification date."
  filter:
    province: "Province"
    age_band: "Age band"
    sex: "Sex"
    hcw: "Healthcare worker"
    vital: "Vital-outcome def."
    window: "Time window"
    all: "All"
    female: "Female"
    male: "Male"
    hcw_yes: "HCW"
    hcw_no: "Non-HCW"
    vital_union: "Recorded death (union)"
    vital_alert: "Death alert only"
    vital_sample: "Deceased at sampling"
    win_all: "Entire period"
    win_30: "Last 30 d"
    win_14: "Last 14 d"
    reset: "Reset"
    selected: "{n} selected"
  sections:
    glance: "At a glance"
    glance_n: "current selection"
    cohort: "Who is in this selection, and how complete are the records?"
    cohort_n: "who · missing fields"
    cohort_desc: "Side-by-side profile of laboratory-confirmed vs test-negative patients in the current filters, plus how often each analysis field is filled in. Charts below only use records that have the dates or fields they need."
    baseline_title: "Confirmed vs test-negative profile<span>who looks different between groups</span>"
    complete_title: "How often is each field filled in?<span>recorded vs missing</span>"
    methods_plain: "<b>How to read these analyses.</b> Figures describe associations in observational data — they do not prove cause and effect. Confidence intervals are not adjusted for looking at many symptoms at once, so treat single ‘significant’ cells cautiously and favour overall patterns. <span class=\"gloss\" data-tip=\"A delay is right-truncated when observation ends (the data cut) before the event can finish happening — e.g. recent admissions may not yet have recorded a death or discharge.\">Right truncation</span> and incomplete follow-up matter especially for recent weeks and for onset-based delays (see Methods for technical detail)."
    daily: "1 · Daily hospitalisations & deaths"
    daily_n: "by admission / death date"
    daily_desc: "Daily hospital admissions (by admission date) and recorded deaths (by notification date), stacked by the chosen stratum, with a cumulative line on the right axis (cumulative within the selected time window). Deaths use the vital-outcome definition set in the filter bar. Respects all filters."
    stratify: "Stratify by"
    strat_sex: "Sex"
    strat_age: "Age"
    strat_hcw: "Healthcare"
    strat_none: "None"
    pyramids: "2 · Age & sex distribution, by test status"
    pyramids_n: "pyramids + positivity"
    pyramids_desc: "Age-and-sex pyramids for confirmed-positive and test-negative case-patients (mirrors Fig. S1), plus test positivity by age band and sex — showing whether the probability of a positive test differs by age or sex in the current selection."
    mort: "3 · Mortality by admission date"
    mort_n: "deaths / admissions per week"
    mort_desc: "Weekly proportion of admitted individuals recorded as having died, by week of hospital admission (Wilson 95% CI), with weekly admission volume for context."
    mort_caveat: "<b>Interpretation caveat.</b> Recent weeks often look artificially ‘low mortality’ because deaths (and hospital exits) are recorded with lag — incomplete follow-up, not necessarily improving survival. Compare earlier weeks for more stable proportions."
    sym_table: "4 · Signs & symptoms at presentation — confirmed vs negative"
    sym_table_n: "Table 1"
    sym_table_desc: "Relative difference in presenting signs and symptoms between laboratory-confirmed and test-negative case-patients (records with a completed symptom field). Risk difference uses a Newcombe 95% CI; risk ratio a Katz-log 95% CI (computed live for the current selection). Green = lower in confirmed, red = higher in confirmed."
    sym_status: "5 · Confirmed symptoms & association with death"
    sym_status_n: "prevalence + death RR"
    sym_status_desc: "Left: how common each presenting symptom is among laboratory-confirmed cases. Right: relative risk of a recorded death among confirmed cases who present with each symptom versus those who do not (Katz 95% CI). Helps highlight higher-risk presentations for triage — not a substitute for clinical judgement."
    triage_note: "<b>Clinical triage.</b> Identifying patients at higher risk of death supports decisions such as closer observation and more intensive nursing. These panels summarise associations in the line list; they do not replace bedside assessment."
    prev_title: "Symptom prevalence among confirmed<span>records with a symptom field</span>"
    deathrr_title: "Relative risk of death by presenting symptom<span>confirmed cases · with vs without each symptom</span>"
    triage_risk: "Symptoms, days since onset, and death"
    triage_risk_n: "triage risk panel"
    triage_risk_desc: "Among confirmed cases with a usable symptom-onset date, death recording by days from onset to hospital admission (columns) and by presenting symptom (rows). Cells with too few patients are blank. Useful for seeing whether late presentation and specific symptoms coincide with higher recorded death."
    status_axis: "Status axis"
    status_test: "Test status"
    status_vital: "Vital outcome"
    cooccur: "6 · Symptom co-occurrence"
    cooccur_n: "correlation + combinations"
    cooccur_desc: "Left: pairwise correlation (<span class=\"gloss\" data-tip=\"φ (phi) measures how often two symptoms co-occur beyond chance, from −1 to +1.\">φ</span> coefficient) between presenting symptoms. Right: an UpSet plot of the most frequent combinations of the six most common symptoms. Both default to confirmed cases; switch cohort at right."
    wet_stage_note: "<b>Clinical reading (6b).</b> Frequent combinations that include diarrhoea, vomiting or haemorrhagic signs suggest many patients are already in the ‘wet’ symptomatic phase at presentation — relevant for isolation, PPE and triage."
    hcw_section: "Healthcare workers (aggregate only)"
    hcw_section_n: "no individual timelines"
    hcw_section_desc: "Aggregated view of healthcare workers in the current selection (counts, age/sex mix, top symptoms, recorded deaths). Fine-grained timelines and onset dates are not shown, to reduce re-identification risk when numbers are small."
    hcw_suppressed: "Healthcare-worker detail is suppressed for this selection (n &lt; {n}) to reduce re-identification risk. Broaden filters or view the full period for an aggregate summary."
    cohort_label: "Cohort"
    cohort_confirmed: "Confirmed"
    cohort_all: "All with symptoms"
    ct: "7 · Ct values by vital outcome"
    ct_n: "Altona (PCRA) · ante-mortem blood"
    ct_desc: "Cycle-threshold (Ct) values among confirmed positives, by vital outcome, for the Altona (PCRA) assay. Restricted to ante-mortem blood specimens: deceased-at-collection samples are almost entirely post-mortem swabs (a different specimen with degraded RNA), so an unrestricted died-vs-alive Ct comparison would confound outcome with specimen type. Lower Ct = higher viral load; the caption gives median [IQR] and the crude difference (small ante-mortem death counts, so interpret cautiously). Ct is not comparable across assays."
    onset_sel: "Onset documentation — included vs excluded"
    onset_sel_n: "selection check for onset-based analyses"
    onset_sel_desc: "The delay distributions (§8–10) condition on a reliable symptom onset (≥ 15 Jun 2026) and are complete-case — a minority of confirmed cases. This table compares those that qualify with those excluded (standardized differences) so any selection bias is visible."
    delays: "8–10 · Clinical delay distributions"
    delays_n: "empirical + epidist / MLE fits"
    delays_desc: "Empirical delay histograms (grey, current selection) with parametric fits (lognormal / gamma / Weibull; ★ = best by LOOIC/AIC) precomputed with <b>epidist</b> — adjusting for double interval-censoring and <span class=\"gloss\" data-tip=\"A delay is right-truncated when observation ends (the data cut) before the event can finish happening — e.g. recent admissions may not yet have recorded a death or discharge.\">right truncation</span> (observation date = data cut, so delays not yet fully observed near the cut-off are corrected for). Use the per-panel selector for stratified fits. <b>Onset→admission</b> requires onset &lt; admission and onset ≥ 15 Jun. <b>Onset→death</b> is restricted to in-hospital deaths with a hospital-exit date."
    adm_sym: "11 · Admission delay vs symptoms at onset"
    adm_sym_n: "median onset→admission"
    adm_sym_desc: "Whether presenting with a given symptom at onset is associated with a faster or slower onset→hospital-admission delay."
    adm_sym_caveat: "<b>Interpretation caveat.</b> Self-reported symptom onset is often imprecise. Patterns such as severe signs (e.g. haemorrhage) appearing to start only one or two days before admission are clinically unexpected and usually mean the onset date is unreliable — treat these delay estimates with low confidence."
    supp_died: "Supplementary · signs & symptoms among the deceased"
    supp_died_n: "positive vs negative · died only"
    supp_died_desc: "Table 4 restricted to individuals recorded as having died — comparing presenting signs and symptoms of confirmed-positive vs test-negative fatal cases (same estimators as Table 4). Sample sizes are smaller, so several risk ratios may be imprecise or not estimable."
    supp_rr: "Supplementary · age- & sex-adjusted symptom associations"
    supp_rr_n: "modified Poisson · confirmed cases"
    supp_rr_desc: "Adjusted risk ratios (mirrors Table S1) for each presenting symptom among confirmed cases, from modified Poisson regression (log link, robust variance) with male sex and age (per 10-yr increment) entered simultaneously. Precomputed for the selected time window. NE = not estimable (<10 events or <3 in a sex stratum)."
