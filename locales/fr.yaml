clinical:
  title: "Caractéristiques cliniques de la MVE — RD Congo"
  subtitle: "Profil clinique de la réponse à la maladie à virus Bundibugyo (MVE) · champ analytique : {nscope} dossiers ayant atteint le prélèvement / les tests (issue positive, négative ou inconnue), sur {nraw} dans la liste brute · généré le {generated}. Les mesures fondées sur la date d'apparition utilisent une apparition ≥ 15 juin 2026 (dates antérieures peu fiables)."
  header_sub: "Symptômes cliniques · coupure des données <b>{snap}</b>"
  scope_note: "<b>Champ analytique :</b> dossiers ayant atteint le prélèvement / les tests (échantillon, dossier de laboratoire ou classification finale) ; les alertes jamais prélevées / invalidées sont exclues. <b>Deux axes de statut sont utilisés partout.</b> <b>Statut de test</b> = confirmé en laboratoire vs testé négatif vs <b>inconnu</b> (prélevé mais pas encore classé). <b>Statut vital</b> = <b>décédé</b> (enregistré comme alerte décès <i>ou</i> décédé au prélèvement) vs <b>aucun décès enregistré</b> — ce dernier n'implique <i>pas</i> la survie (l'issue peut simplement être non renseignée), donc les proportions de décès ne sont pas un taux de létalité. La fenêtre temporelle est ancrée sur la date de notification."
  filter:
    province: "Province"
    age_band: "Tranche d'âge"
    sex: "Sexe"
    hcw: "Travailleur de santé"
    vital: "Déf. du statut vital"
    window: "Fenêtre temporelle"
    all: "Tous"
    female: "Femme"
    male: "Homme"
    hcw_yes: "TS"
    hcw_no: "Non-TS"
    vital_union: "Décès enregistré (union)"
    vital_alert: "Alerte décès seulement"
    vital_sample: "Décédé au prélèvement"
    win_all: "Toute la période"
    win_30: "30 derniers j"
    win_14: "14 derniers j"
    reset: "Réinitialiser"
    selected: "{n} sélectionné(s)"
  sections:
    glance: "En un coup d'œil"
    glance_n: "sélection actuelle"
    cohort: "Qui entre dans cette sélection, et à quel point les dossiers sont-ils complets ?"
    cohort_n: "qui · champs manquants"
    cohort_desc: "Profil côte à côte des patients confirmés en laboratoire et des patients testés négatifs dans les filtres actuels, plus la fréquence de renseignement de chaque champ d'analyse. Les graphiques ci-dessous n'utilisent que les dossiers qui ont les dates ou champs nécessaires."
    baseline_title: "Profil confirmés vs testés négatifs<span>ce qui diffère entre les groupes</span>"
    complete_title: "À quelle fréquence chaque champ est-il renseigné ?<span>renseigné vs manquant</span>"
    methods_plain: "<b>Comment lire ces analyses.</b> Les figures décrivent des associations dans des données observationnelles — elles ne prouvent pas de lien de cause à effet. Les intervalles de confiance ne sont pas ajustés pour l'examen de nombreux symptômes à la fois : interprétez avec prudence les cellules isolées « significatives » et privilégiez les tendances d'ensemble. La <span class=\"gloss\" data-tip=\"Un délai est tronqué à droite lorsque l'observation s'arrête (coupure des données) avant que l'événement puisse se terminer — p. ex. des admissions récentes peuvent ne pas encore avoir de décès ou de sortie enregistrés.\">troncature à droite</span> et le suivi incomplet comptent surtout pour les semaines récentes et les délais fondés sur l'apparition (voir Méthodes pour le détail technique)."
    daily: "1 · Hospitalisations et décès quotidiens"
    daily_n: "par date d'admission / de décès"
    daily_desc: "Admissions hospitalières quotidiennes (par date d'admission) et décès enregistrés (par date de notification), empilés selon le stratum choisi, avec une courbe cumulative sur l'axe de droite (cumul dans la fenêtre temporelle sélectionnée). Les décès utilisent la définition du statut vital choisie dans la barre de filtres. Respecte tous les filtres."
    stratify: "Stratifier par"
    strat_sex: "Sexe"
    strat_age: "Âge"
    strat_hcw: "Soins"
    strat_none: "Aucun"
    pyramids: "2 · Répartition par âge et sexe, selon le statut de test"
    pyramids_n: "pyramides + positivité"
    pyramids_desc: "Pyramides âge-sexe pour les cas confirmés positifs et les cas testés négatifs (comme la fig. S1), plus la positivité des tests par tranche d'âge et sexe — pour voir si la probabilité d'un test positif diffère selon l'âge ou le sexe dans la sélection actuelle."
    mort: "3 · Mortalité selon la date d'admission"
    mort_n: "décès / admissions par semaine"
    mort_desc: "Proportion hebdomadaire des personnes admises enregistrées comme décédées, selon la semaine d'admission hospitalière (IC de Wilson à 95 %), avec le volume hebdomadaire d'admissions pour contexte."
    mort_caveat: "<b>Mise en garde d'interprétation.</b> Les semaines récentes semblent souvent à « faible mortalité » de façon artificielle, car les décès (et sorties) sont enregistrés avec un décalage — suivi incomplet, pas forcément une amélioration de la survie. Comparez les semaines plus anciennes pour des proportions plus stables."
    sym_table: "4 · Signes et symptômes à la présentation — confirmés vs négatifs"
    sym_table_n: "Tableau 1"
    sym_table_desc: "Différence relative des signes et symptômes à la présentation entre cas confirmés en laboratoire et cas testés négatifs (dossiers avec champ symptômes renseigné). La différence de risque utilise un IC de Newcombe à 95 % ; le rapport de risques un IC Katz-log à 95 % (calculé en direct pour la sélection actuelle). Vert = plus bas chez les confirmés, rouge = plus élevé chez les confirmés."
    sym_status: "5 · Symptômes chez les confirmés et lien avec le décès"
    sym_status_n: "prévalence + RR de décès"
    sym_status_desc: "Gauche : fréquence de chaque symptôme à la présentation chez les cas confirmés en laboratoire. Droite : risque relatif de décès enregistré chez les confirmés qui présentent chaque symptôme vs ceux qui ne le présentent pas (IC Katz à 95 %). Aide à repérer les présentations à plus haut risque pour le triage — ne remplace pas le jugement clinique."
    triage_note: "<b>Triage clinique.</b> Identifier les patients à plus haut risque de décès aide à décider d'une surveillance plus rapprochée et de soins infirmiers plus intensifs. Ces panneaux résument des associations dans la liste linéaire ; ils ne remplacent pas l'évaluation au lit du malade."
    prev_title: "Prévalence des symptômes chez les confirmés<span>dossiers avec champ symptômes</span>"
    deathrr_title: "Risque relatif de décès selon le symptôme à la présentation<span>cas confirmés · avec vs sans chaque symptôme</span>"
    triage_risk: "Symptômes, jours depuis l'apparition, et décès"
    triage_risk_n: "panel de risque pour le triage"
    triage_risk_desc: "Parmi les cas confirmés avec une date d'apparition utilisable, décès enregistrés selon les jours entre apparition et admission (colonnes) et selon le symptôme à la présentation (lignes). Les cellules trop petites sont laissées vides. Utile pour voir si une présentation tardive et certains symptômes coïncident avec plus de décès enregistrés."
    status_axis: "Axe de statut"
    status_test: "Statut de test"
    status_vital: "Statut vital"
    cooccur: "6 · Co-occurrence des symptômes"
    cooccur_n: "corrélation + combinaisons"
    cooccur_desc: "Gauche : corrélation par paires (coefficient <span class=\"gloss\" data-tip=\"φ (phi) mesure la co-occurrence de deux symptômes au-delà du hasard, de −1 à +1.\">φ</span>) entre symptômes à la présentation. Droite : diagramme UpSet des combinaisons les plus fréquentes des six symptômes les plus courants. Les deux par défaut sur les cas confirmés ; changez la cohorte à droite."
    wet_stage_note: "<b>Lecture clinique (6b).</b> Des combinaisons fréquentes incluant diarrhée, vomissements ou signes hémorragiques suggèrent que beaucoup de patients sont déjà en phase symptomatique « humide » à la présentation — pertinent pour l'isolement, les EPI et le triage."
    hcw_section: "Travailleurs de santé (agrégé seulement)"
    hcw_section_n: "pas de chronologies individuelles"
    hcw_section_desc: "Vue agrégée des travailleurs de santé dans la sélection actuelle (effectifs, mix âge/sexe, symptômes principaux, décès enregistrés). Les chronologies fines et dates d'apparition ne sont pas affichées, pour limiter le risque de ré-identification lorsque les effectifs sont faibles."
    hcw_suppressed: "Le détail travailleurs de santé est masqué pour cette sélection (n &lt; {n}) afin de limiter le risque de ré-identification. Élargissez les filtres ou consultez toute la période pour un résumé agrégé."
    cohort_label: "Cohorte"
    cohort_confirmed: "Confirmés"
    cohort_all: "Tous avec symptômes"
    ct: "7 · Valeurs de Ct selon le statut vital"
    ct_n: "Altona (PCRA) · sang ante-mortem"
    ct_desc: "Valeurs de seuil de cycle (Ct) chez les confirmés positifs, selon le statut vital, pour le dosage Altona (PCRA). Limité aux prélèvements sanguins ante-mortem : les échantillons de personnes décédées au prélèvement sont presque tous des écouvillons post-mortem (spécimen différent avec ARN dégradé), donc une comparaison Ct décédés/vivants non restreinte confondrait l'issue et le type de spécimen. Ct plus bas = charge virale plus élevée."
    onset_sel: "Documentation de l'apparition — inclus vs exclus"
    onset_sel_n: "contrôle de sélection pour les analyses fondées sur l'apparition"
    onset_sel_desc: "Les distributions de délais (§8–10) conditionnent une apparition fiable des symptômes (≥ 15 juin 2026) et sont en cas complets — une minorité des cas confirmés. Ce tableau compare ceux qui sont éligibles et ceux qui sont exclus (différences standardisées) pour rendre visible tout biais de sélection."
    delays: "8–10 · Distributions des délais cliniques"
    delays_n: "empirique + ajustements epidist / MLE"
    delays_desc: "Histogrammes empiriques des délais (gris, sélection actuelle) avec ajustements paramétriques (lognormale / gamma / Weibull ; ★ = meilleur selon LOOIC/AIC) précalculés avec <b>epidist</b> — en tenant compte de la double censure par intervalle et de la <span class=\"gloss\" data-tip=\"Un délai est tronqué à droite lorsque l'observation s'arrête (coupure des données) avant que l'événement puisse se terminer — p. ex. des admissions récentes peuvent ne pas encore avoir de décès ou de sortie enregistrés.\">troncature à droite</span> (date d'observation = coupure des données). Utilisez le sélecteur par panneau pour les strates. <b>Apparition→admission</b> exige apparition &lt; admission et apparition ≥ 15 juin. <b>Apparition→décès</b> est limité aux décès à l'hôpital avec date de sortie."
    adm_sym: "11 · Délai d'admission selon les symptômes à l'apparition"
    adm_sym_n: "médiane apparition→admission"
    adm_sym_desc: "Le fait de présenter un symptôme donné à l'apparition est-il associé à un délai apparition→admission hospitalière plus court ou plus long."
    adm_sym_caveat: "<b>Mise en garde d'interprétation.</b> La date d'apparition autodéclarée est souvent imprécise. Des schémas tels que des signes sévères (p. ex. hémorragie) apparaissant seulement un ou deux jours avant l'admission sont cliniquement inattendus et indiquent en général une date d'apparition peu fiable — accordez une faible confiance à ces délais."
    supp_died: "Complément · signes et symptômes chez les personnes décédées"
    supp_died_n: "positifs vs négatifs · décédés seulement"
    supp_died_desc: "Tableau 4 limité aux personnes enregistrées comme décédées — comparaison des signes et symptômes à la présentation des cas fatals confirmés positifs vs testés négatifs (mêmes estimateurs que le tableau 4). Effectifs plus petits : plusieurs rapports de risques peuvent être imprécis ou non estimables."
    supp_rr: "Complément · associations de symptômes ajustées sur l'âge et le sexe"
    supp_rr_n: "Poisson modifié · cas confirmés"
    supp_rr_desc: "Rapports de risques ajustés (comme le tableau S1) pour chaque symptôme à la présentation parmi les cas confirmés, par régression de Poisson modifiée (lien log, variance robuste) avec sexe masculin et âge (par tranche de 10 ans) saisis simultanément. Précalculés pour la fenêtre temporelle sélectionnée. NE = non estimable (<10 événements ou <3 dans un stratum de sexe)."
